<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Duna Networks - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue: #3b82f6; --indigo: #4f46e5; --navy: #0f172a; --ink: #1e293b;
            --muted: #64748b; --line: #e2e8f0; --green: #10b981; --teal: #0f766e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #f8fbff 0%, #eef3fb 55%, #e9eefb 100%);
            color: var(--ink); line-height: 1.5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }

        .topbar {
            flex: 0 0 auto; position: relative; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 12px max(20px, env(safe-area-inset-left)) 12px max(20px, env(safe-area-inset-right));
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
        .brand-logo { width: 46px; height: 46px; display: grid; place-items: center; flex-shrink: 0; }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
        .brand-logo .fallback { display: none; width: 100%; height: 100%; border-radius: 12px; background: linear-gradient(135deg, #2563eb, var(--indigo)); color: white; place-items: center; font-size: 20px; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
        .brand-text strong { font-size: 20px; font-weight: 800; color: #1e3a8a; letter-spacing: -0.3px; white-space: nowrap; }
        .brand-text small { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1px; }

        .top-actions { display: flex; align-items: center; gap: 10px; }
        .lang-select { position: relative; display: flex; align-items: center; background: white; border: 1px solid var(--line); border-radius: 999px; padding: 0 12px 0 14px; height: 42px; gap: 8px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
        .lang-select i { color: var(--blue); font-size: 18px; pointer-events: none; }
        .lang-select select { appearance: none; -webkit-appearance: none; border: none; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); padding-right: 18px; height: 100%; cursor: pointer; outline: none; }
        .lang-select::after { content: ""; position: absolute; right: 14px; top: 50%; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
        .lang-select:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .icon-btn { width: 42px; height: 42px; border-radius: 12px; background: #e8eef8; color: #1e3a8a; display: grid; place-items: center; text-decoration: none; transition: background 0.2s; }
        .icon-btn:hover { background: #dbe5f5; }

        .page { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 48px; max-width: 1240px; margin: 0 auto; padding: 48px 24px 24px; align-items: start; }
        .pill { display: inline-flex; align-items: center; gap: 8px; background: white; padding: 7px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--teal); border: 1px solid var(--line); letter-spacing: 0.6px; margin-bottom: 22px; text-transform: uppercase; }
        .dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; flex-shrink: 0; }

        h1 { font-size: clamp(34px, 5.2vw, 58px); line-height: 1.08; font-weight: 800; color: var(--navy); letter-spacing: -1px; margin-bottom: 18px; }
        h1 .highlight { color: #2f4fd8; display: block; }
        .desc { font-size: clamp(15px, 1.6vw, 18px); color: var(--muted); max-width: 520px; margin-bottom: 30px; }

        .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px; }
        .feature-box { background: rgba(255, 255, 255, 0.9); padding: 18px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 4px 10px rgba(15, 23, 42, 0.03); }
        .feature-box .ic { width: 42px; height: 42px; border-radius: 12px; background: #e8f0fe; color: #2563eb; display: grid; place-items: center; font-size: 18px; margin-bottom: 12px; }
        .feature-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .feature-box p { font-size: 12.5px; color: var(--muted); }
        .footer-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); }

        .auth { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 460px; justify-self: center; }
        .login-card { background: white; border-radius: 28px; box-shadow: 0 20px 45px rgba(15, 23, 42, 0.09); overflow: hidden; border: 1px solid var(--line); }
        .card-header { background: linear-gradient(180deg, #eef5ff 0%, #ffffff 100%); padding: 34px 32px 14px; text-align: center; }
        .lock-icon-bg { background: linear-gradient(135deg, #2563eb, var(--indigo)); width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; color: white; font-size: 24px; margin: 0 auto 16px; box-shadow: 0 10px 18px -4px rgba(59, 130, 246, 0.45); }
        .sec-title { font-size: 11px; font-weight: 700; color: #1e5a8e; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
        .card-header h2 { font-size: clamp(24px, 3.4vw, 30px); font-weight: 800; color: #10294f; letter-spacing: -0.5px; }
        .card-header p { font-size: 14px; color: var(--muted); margin-top: 8px; }

        .card-body { padding: 24px 32px 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #334155; margin-bottom: 8px; letter-spacing: 0.6px; }
        .form-group label i { color: #1e5a8e; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 14px; font: inherit; font-size: 15px; outline: none; transition: all 0.2s; background: white; }
        .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12); }

        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(90deg, #2a4fd6, var(--indigo)); color: white; border: none; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s; box-shadow: 0 8px 16px -4px rgba(59, 130, 246, 0.45); }
        .btn-submit:hover { box-shadow: 0 10px 20px -4px rgba(59, 130, 246, 0.55); }
        .btn-submit:active { transform: scale(0.99); }
        .btn-submit:disabled { opacity: 0.75; cursor: wait; }

        .error-message { color: #dc2626; font-size: 13px; text-align: center; margin-top: 14px; font-weight: 500; display: none; }

        .roster-toggle { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; border-top: 1px solid var(--line); padding-top: 18px; }
        .roster-toggle .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
        .roster-toggle .chev { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; color: #1e3a8a; background: white; transition: all 0.2s; }
        .roster-toggle:hover .chev { border-color: var(--blue); }
        .roster-toggle.open .chev { background: var(--indigo); color: white; border-color: var(--indigo); transform: rotate(180deg); }

        .roster-card { display: none; background: white; border-radius: 24px; border: 1px solid var(--line); box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08); padding: 20px; animation: rise 0.3s ease; }
        .roster-card.open { display: block; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .roster-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
        .roster-nav button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #f1f5f9; color: #334155; font-size: 14px; cursor: pointer; display: grid; place-items: center; transition: all 0.15s; flex-shrink: 0; }
        .roster-nav button:hover:not(:disabled) { background: var(--indigo); color: white; border-color: var(--indigo); }
        .roster-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
        .roster-title { text-align: center; min-width: 0; }
        .roster-title h3 { font-size: 20px; font-weight: 800; color: var(--navy); letter-spacing: 0.3px; text-transform: uppercase; }
        .roster-title small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }

        .segment-title { font-size: 13px; font-weight: 800; color: var(--indigo); text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; }
        .shift { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; background: white; }
        .shift img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e2e8f0; }
        .shift-main { flex: 1; min-width: 0; }
        .shift-main strong { display: block; font-size: 15px; font-weight: 700; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .shift-main span { display: block; font-size: 12px; color: var(--muted); }
        .shift-time { font-size: 13px; font-weight: 700; text-align: right; white-space: nowrap; }
        .shift-time.done { color: #22a06b; }
        .shift-time.active { color: var(--indigo); }
        .shift-time.scheduled { color: var(--muted); }

        .roster-msg { text-align: center; color: var(--muted); padding: 26px 8px; font-size: 14px; }
        .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--indigo); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .legal { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: #94a3b8; text-transform: uppercase; padding: 24px 20px calc(28px + env(safe-area-inset-bottom)); }

        @media (max-width: 1000px) {
            .page { grid-template-columns: 1fr; gap: 28px; padding: 32px 18px 12px; }
            .intro { text-align: center; }
            .desc { margin-left: auto; margin-right: auto; }
            .footer-note { justify-content: center; }
            .auth { max-width: 560px; }
        }
        @media (max-width: 640px) {
            .topbar { padding-top: 10px; padding-bottom: 10px; }
            .brand-logo { width: 40px; height: 40px; }
            .brand-text strong { font-size: 17px; }
            .lang-select { height: 40px; padding-left: 10px; }
            .lang-select select { font-size: 13px; }
            .icon-btn { width: 40px; height: 40px; }
            .features { grid-template-columns: 1fr; gap: 10px; }
            .feature-box { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; }
            .feature-box .ic { margin-bottom: 0; flex-shrink: 0; }
            .card-header { padding: 28px 22px 10px; }
            .card-body { padding: 20px 22px 26px; }
            .roster-card { padding: 16px; border-radius: 20px; }
            .form-group input, .lang-select select { font-size: 16px; }
        }
        @media (max-width: 380px) { .brand-text small { display: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>

                        <p data-i18n="sub"></p>
                    </div>
                    <div class="card-body">
                        <form id="loginForm" autocomplete="on">
                            <div class="form-group">
                                <label for="username"><i class="far fa-user"></i><span data-i18n="userLabel"></span></label>
                                <input type="text" id="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" data-i18n-placeholder="userPh" required>
                            </div>
                            <div class="form-group">
                                <label for="password"><i class="fas fa-shield-alt"></i><span data-i18n="passLabel"></span></label>
                                <input type="password" id="password" autocomplete="current-password" data-i18n-placeholder="passPh" required>
                            </div>
                            <button type="submit" class="btn-submit" id="submitBtn"></button>
                            <p class="error-message" id="errorMessage" role="alert"></p>
                        </form>

                        <div class="roster-toggle" id="rosterToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="rosterCard">
                            <span class="label" data-i18n="viewRoster"></span>
                            <span class="chev"><i class="fas fa-chevron-down"></i></span>
                        </div>
                    </div>
                </div>

                <div class="roster-card" id="rosterCard">
                    <div class="roster-nav">

                        <div class="roster-title"><h3 id="rosterTitle"></h3><small id="rosterDate"></small></div>
                        <button type="button" id="nextDay" data-i18n-title="nextDay"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div id="rosterBody"></div>
                </div>
            </section>
        </main>

        <footer class="legal" data-i18n="copyright"></footer>

            de: {
                home: 'Zurück zur Startseite', badge: 'Duna Networks Mitarbeiterportal',
                hero1: 'Dein Arbeitstag,', hero2: 'vernetzt.',
                desc: 'Greife sicher auf Dienstplan, Anwesenheit, Teamkommunikation und Arbeitsbereich an einem Ort zu.',
                f1t: 'Dienstplan & Anwesenheit', f1d: 'Alle Infos zum Arbeitstag an einem Ort.',
                f2t: 'Teamkommunikation', f2d: 'Bleib mit deinen Kollegen in Kontakt.',
                f3t: 'Arbeitsbereich', f3d: 'Greife sicher auf die benötigten Tools zu.',
                protected: 'Geschützter Mitarbeiterzugang · Duna Networks KFT',
                secure: 'Sicherer Zugang', welcome: 'Willkommen zurück',
                sub: 'Melde dich in deinem Duna-Networks-Mitarbeiterbereich an.',
                userLabel: 'Mitarbeiter-ID', userPh: 'Mitarbeiter-ID eingeben',
                passLabel: 'Sicheres Passwort', passPh: 'Passwort eingeben',
                submit: 'Arbeitsbereich öffnen', authing: 'Authentifizierung...',
                viewRoster: 'Heutigen Dienstplan anzeigen', prevDay: 'Vorheriger Tag', nextDay: 'Nächster Tag',
                today: 'Heute', yesterday: 'Gestern', tomorrow: 'Morgen',
                rosterLoading: 'Dienstplan wird geladen...', rosterEmpty: 'Für diesen Tag sind keine Schichten geplant.',
                rosterError: 'Dienstplan konnte nicht geladen werden.',
                done: 'Beendet', active: 'Aktiv', scheduled: 'Geplant', segment: '{x}-Segment', general: 'Allgemein',
                errInvalid: 'Ungültige Mitarbeiter-ID oder ungültiges Passwort', errFailed: 'Anmeldung fehlgeschlagen. Bitte erneut versuchen.',
                errInactive: 'Dieses Konto ist inaktiv. Bitte HR kontaktieren.',
                errTooMany: 'Zu viele Versuche. Bitte später erneut versuchen.',
                errNetwork: 'Netzwerkfehler. Verbindung prüfen.',
                errNoProfile: 'Dieses Konto ist noch nicht eingerichtet. Bitte HR kontaktieren.',
                copyright: '© 2026 Duna Networks KFT. Alle Rechte vorbehalten. · Internes Mitarbeiterportal'
            }
        };

        const $ = id => document.getElementById(id);
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        let lang = (() => {
            const saved = localStorage.getItem('duna_lang');
            if (saved && I18N[saved]) return saved;
            const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
            return I18N[nav] ? nav : 'en';
        })();
        const t = key => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

        // ====================== Language ======================
        let busy = false;
        let lastError = null;

        function setSubmitLabel() {
            $('submitBtn').innerHTML = busy
                ? `<i class="fas fa-spinner fa-spin"></i> ${esc(t('authing'))}`
                : `<i class="fas fa-unlock-alt"></i> ${esc(t('submit'))} &rarr;`;
        }
        function showError(err) {
            lastError = err;
            const el = $('errorMessage');
            el.textContent = err.key ? t(err.key) : err.text;
            el.style.display = 'block';
        }
        function clearError() { lastError = null; $('errorMessage').style.display = 'none'; }

        function applyLang() {
            document.documentElement.lang = lang;
            $('langSelect').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
            setSubmitLabel();
            if (lastError) showError(lastError);
            renderRoster();
        }
        $('langSelect').addEventListener('change', e => {
            lang = e.target.value;
            localStorage.setItem('duna_lang', lang);
            applyLang();
        });

        // ====================== Header bits ======================
        const logo = $('logoImg');
        logo.src = CONFIG.LOGO_URL;
        logo.addEventListener('error', () => { logo.style.display = 'none'; $('logoFallback').style.display = 'grid'; });
        $('homeBtn').href = CONFIG.HOME_URL;

        // ====================== Roster ======================
        let rosterData = null;
        let rosterStatus = 'idle';
        let dayOffset = 0;

        const dateForOffset = o => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + o); return d; };
        function normTime(v) {
            const m = String(v ?? '').match(/(\d{1,2}):(\d{2})/);
            return m ? `${m[1].padStart(2, '0')}:${m[2]}` : null;
        }
        function pickTime(entry, keys) { for (const k of keys) { const v = normTime(entry[k]); if (v) return v; } return null; }
        const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

        function shiftStatus(offset, start, end) {
            if (offset < 0) return 'done';
            if (offset > 0) return 'scheduled';
            if (!start) return 'scheduled';
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes();
            const s = toMin(start);
            if (mins < s) return 'scheduled';
            if (end) { const e = toMin(end); if (e >= s && mins >= e) return 'done'; }
            return 'active';
        }

        function buildShifts(offset) {
            if (!rosterData) return [];
            const schedule = rosterData.schedule || {};
            const locations = rosterData.employeeLocations || {};
            const images = rosterData.employeeImages || rosterData.images || {};
            const d = dateForOffset(offset);
            const year = String(d.getFullYear());
            const month = MONTHS[d.getMonth()];
            const day = d.getDate();
            const out = [];

            Object.keys(schedule).forEach(name => {
                const entry = schedule[name]?.[year]?.[month]?.[day];
                if (!entry || !entry.area) return;
                const start = pickTime(entry, CONFIG.START_KEYS);
                const end = pickTime(entry, CONFIG.END_KEYS);
                out.push({
                    name, label: String(entry.area),
                    segment: [].concat(locations[name] || [])[0] || t('general'),
                    start, end, status: shiftStatus(offset, start, end),
                    img: images[name] || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4F46E5&color=fff&bold=true`
                });
            });
            return out.sort((a, b) => (a.start || '99:99').localeCompare(b.start || '99:99') || a.label.localeCompare(b.label));
        }

        function timeText(s) {
            const range = s.start && s.end ? `${s.start} - ${s.end}` : (s.start || '');
            if (s.status === 'done') return `${t('done')}${range ? ': ' + range : ''}`;
            if (s.status === 'active') return `${t('active')}${s.start ? ': ' + s.start : ''}`;
            return range || t('scheduled');
        }

        function renderRoster() {
            const offset = dayOffset;
            $('rosterTitle').textContent = offset === 0 ? t('today') : offset < 0 ? t('yesterday') : t('tomorrow');
            $('rosterDate').textContent = dateForOffset(offset).toLocaleDateString(LOCALES[lang], { weekday: 'long', month: 'long', day: 'numeric' });
            $('prevDay').disabled = offset <= -1;
            $('nextDay').disabled = offset >= 1;

            const body = $('rosterBody');
            if (rosterStatus === 'loading' || rosterStatus === 'idle') {
                body.innerHTML = `<div class="roster-msg"><div class="spinner"></div>${esc(t('rosterLoading'))}</div>`;
                return;
            }
            if (rosterStatus === 'error') { body.innerHTML = `<div class="roster-msg">${esc(t('rosterError'))}</div>`; return; }

            const shifts = buildShifts(offset);
            if (!shifts.length) { body.innerHTML = `<div class="roster-msg">${esc(t('rosterEmpty'))}</div>`; return; }

            const groups = {};
            shifts.forEach(s => { (groups[s.segment] = groups[s.segment] || []).push(s); });
            body.innerHTML = Object.keys(groups).sort().map(seg => `
                <div class="segment-title">${esc(t('segment').replace('{x}', seg))}</div>
                ${groups[seg].map(s => `
                    <div class="shift">
                        <img src="${esc(s.img)}" alt="" loading="lazy">
                        <div class="shift-main">
                            <strong>${esc(s.label)}</strong>
                            ${CONFIG.SHOW_NAMES ? `<span>${esc(s.name)}</span>` : ''}
                        </div>
                        <div class="shift-time ${s.status}">${esc(timeText(s))}</div>
                    </div>`).join('')}
            `).join('');
        }

        async function loadRoster() {
            if (rosterData || rosterStatus === 'loading') return;
            rosterStatus = 'loading';
            renderRoster();
            try {
                const res = await fetch(CONFIG.SCRIPT_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                rosterData = await res.json();
                rosterStatus = 'ready';
            } catch (err) {
                console.error('Roster load failed:', err);
                rosterStatus = 'error';
            }
            renderRoster();
        }

        function toggleRoster() {
            const toggle = $('rosterToggle');
            const card = $('rosterCard');
            const open = !card.classList.contains('open');
            card.classList.toggle('open', open);
            toggle.classList.toggle('open', open);
            toggle.setAttribute('aria-expanded', String(open));
            if (open) {
                if (rosterStatus === 'error') { rosterData = null; rosterStatus = 'idle'; }
                loadRoster();
                setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
            }
        }
        $('rosterToggle').addEventListener('click', toggleRoster);
        $('rosterToggle').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRoster(); } });
        $('prevDay').addEventListener('click', () => { if (dayOffset > -1) { dayOffset--; renderRoster(); } });
        $('nextDay').addEventListener('click', () => { if (dayOffset < 1) { dayOffset++; renderRoster(); } });

        // ====================== Login (Firebase Authentication) ======================
        let submitting = false;

        // Message left by the dashboard when it rejected a session (inactive / not set up)
        const notice = sessionStorage.getItem('duna_login_notice');
        if (notice) { sessionStorage.removeItem('duna_login_notice'); showError({ key: notice }); }

        // Already signed in? Go straight to the app.
        onAuthStateChanged(auth, user => {
            if (user && !submitting) window.location.replace('index.html');
        });

        function mapAuthError(err) {
            const c = (err && err.code) || '';
            if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password', 'auth/invalid-email'].includes(c)) return { key: 'errInvalid' };
            if (c === 'auth/too-many-requests') return { key: 'errTooMany' };
            if (c === 'auth/network-request-failed') return { key: 'errNetwork' };
            if (c === 'auth/operation-not-allowed') return { text: 'Email/Password sign-in is not enabled in Firebase Authentication.' };
            console.error('Login error:', err);
            return { key: 'errFailed' };
        }

        $('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const employeeId = $('username').value.trim();
            const password = $('password').value;

            clearError();
            if (!ID_PATTERN.test(employeeId)) { showError({ key: 'errInvalid' }); return; }

            busy = true; submitting = true;
            $('submitBtn').disabled = true;
            setSubmitLabel();

            try {
                const cred = await signInWithEmailAndPassword(auth, emailFor(employeeId), password);
                const snap = await get(ref(db, `users/${cred.user.uid}`));
                const profile = snap.val();

                if (!profile) { await signOut(auth); throw { key: 'errNoProfile' }; }
                if (profile.status && profile.status !== 'active') { await signOut(auth); throw { key: 'errInactive' }; }

                window.location.href = 'index.html';
            } catch (err) {
                showError(err && (err.key || err.text) ? err : mapAuthError(err));
                busy = false; submitting = false;
                $('submitBtn').disabled = false;
                setSubmitLabel();
            }
        });

        // iOS: after the keyboard closes, snap the viewport back
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('blur', () => {
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.documentElement.scrollTop = 0;
                    document.body.scrollTop = 0;
                }, 80);
            });
        });

        applyLang();
    </script>
