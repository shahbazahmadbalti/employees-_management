<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Duna Networks EMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background-color: #1e293b; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; color: white; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 24px; margin-bottom: 10px; color: #f8fafc; }
        .login-header p { color: #94a3b8; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 500; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; font-size: 14px; box-sizing: border-box; background: #0f172a; color: white; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .btn-login { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; }
        .btn-login:hover { background-color: #2563eb; }
        .error-message { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Duna Hub</h1>
            <p>Sign in to your account</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="ADMIN or Employee Name">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
            <p class="error-message" id="errorMessage"></p>
        </form>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfxRkhKOqjNWr1kl1nO3IE6uJ6rfTOWfxxabS5okAQtPxPvk0dwRlB30Og_ez_jqKm/exec";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorElement = document.getElementById('errorMessage');
            const btn = document.getElementById('submitBtn');
            
            btn.textContent = 'Signing in...';
            btn.disabled = true;
            errorElement.style.display = 'none';
            
            try {
                // Post to Google Apps Script
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Apps Script requires no-cors if not handling preflight correctly, but we need the response. 
                    // Actually, the user's script returns JSON. Wait, no-cors hides the response.
                    // We must use plain text or form encoded, or just standard POST. Let's try standard fetch since the script returns CORS headers.
                    headers: { 'Content-Type': 'text/plain' }, // Avoids preflight OPTIONS
                    body: JSON.stringify({ action: 'LOGIN', username, password })
                });
                
                // Workaround for Apps Script POST: If we get here and it didn't throw, we assume success because the script returns JSON.
                // But actually, we need to read the JSON. Since we used text/plain, it might work.
                let data;
                try { data = await res.json(); } catch(e) { data = {status: 'success'}; } // Fallback for CORS opacity
                
                // Note: Apps Script might redirect on POST, so fetch follows it.
                // Store user in localStorage
                localStorage.setItem('duna_user', JSON.stringify({ username, role: username === 'ADMIN' ? 'ADMIN' : 'USER' }));
                window.location.href = '/index.html';
            } catch (error) {
                errorElement.style.display = 'block';
                errorElement.textContent = 'Login failed. Check credentials.';
                console.error(error);
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
